name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Run CLI smoke test
        run: lake exe lean-nano-llvm
      - name: Run standalone .ll regression suite
        run: bash scripts/run_ll_tests.sh
      - name: Verify transitive axioms
        run: lake env lean scripts/audit_axioms.lean
      - name: Verify narrow imports in Tests
        run: bash scripts/check_imports.sh
      - name: Verify no partial definitions outside Llubi
        run: |
          if grep -rnE '^[[:space:]]*((private|protected|noncomputable|scoped|local)[[:space:]]+)*partial\b' \
            --include='*.lean' --exclude-dir='Llubi' LeanNanoLlvm Tests Main.lean; then
            echo "Error: 'partial' definitions are not allowed outside LeanNanoLlvm/Llubi/." >&2
            exit 1
          fi
      - name: Install lit and FileCheck
        run: |
          pip install lit
          sudo apt-get update
          sudo apt-get install -y llvm-18-tools
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - name: Run LLVM llubi test suite (lit + FileCheck)
        run: bash scripts/run_llubi_tests.sh
